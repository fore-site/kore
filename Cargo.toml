[package]
name = "kore"
version = "0.1.0"
edition = "2021"
description = "WASM evaluation script for the Telegraph Protocol — scores miner responses against ground truth"
authors = ["Kore"]
license = "MIT"
repository = "https://github.com/telegraphprotocol/telegraph-usecases"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
